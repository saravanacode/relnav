repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: import-contracts
        name: import contracts (REQ-ARCH-01)
        entry: uv run --no-sync lint-imports
        language: system
        pass_filenames: false
        types: [python]
